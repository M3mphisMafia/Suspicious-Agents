# nginx + njs adapter. Needs ngx_http_js_module and a resolver for ngx.fetch.
#   block  -> 403            tarpit -> 429 + Retry-After 9
#   cell   -> the padded cell origin (CellOriginDomain output; send the origin secret)
#   challenge / allow -> your app, with X-Undertow-Verdict for it to read
js_import undertow from /etc/nginx/undertow.js;
resolver 1.1.1.1 valid=300s;

server {
    listen 443 ssl;
    set $ut_url "https://<api-id>.execute-api.us-east-1.amazonaws.com/_undertow/v1/verdict";  # VerdictApiUrl output
    set $ut_key "uk_...";                                                                       # a verdict key

    location = /_undertow_verdict {
        internal;
        js_content undertow.verdict;
    }

    location / {
        set $ut_method $request_method;          # the subrequest shares this with the main request
        auth_request /_undertow_verdict;
        auth_request_set $undertow $sent_http_x_undertow_verdict;
        error_page 418 = @cell;
        if ($undertow = cell)   { return 418; }
        if ($undertow = tarpit) { add_header Retry-After 9 always; return 429; }
        proxy_set_header X-Undertow-Verdict $undertow;
        proxy_pass http://app_upstream;
    }

    location @cell {
        proxy_set_header Host <cell-origin-domain>;
        proxy_set_header X-Origin-Verify "<origin secret>";
        proxy_ssl_server_name on;
        proxy_pass https://<cell-origin-domain>;
    }
}
